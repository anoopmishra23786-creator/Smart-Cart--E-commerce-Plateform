<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - SmartCart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar sc-navbar">
    <div class="container justify-content-center">
      <a class="sc-brand" href="/index.html">
        <i class="bi bi-cart3"></i>
        <span>SmartCart</span>
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-sm-8">
          <div class="bg-white border rounded-3 p-4 p-md-5 shadow-sm">
            <h3 class="fw-bold mb-2">Create an Account</h3>
            <p class="text-muted small mb-4">Join SmartCart for priority dispatch, order tracking, and wishlists.</p>

            <form id="form-register">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Full Name</label>
                <input type="text" id="reg-name" class="form-control" required placeholder="e.g. Rahul Verma">
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <input type="email" id="reg-email" class="form-control" required placeholder="you@example.com">
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" id="reg-password" class="form-control" required placeholder="At least 6 characters" minlength="6">
              </div>

              <div class="form-check mb-4 small">
                <input class="form-check-input" type="checkbox" id="terms" required checked>
                <label class="form-check-label text-muted" for="terms">
                  I agree to the SmartCart Terms of Service & Privacy Policy.
                </label>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Sign Up
              </button>
            </form>

            <div class="text-center mt-4">
              <span class="small text-muted">Already have an account? </span>
              <a href="/login.html" class="small fw-semibold text-primary text-decoration-none">Sign In</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    document.getElementById('form-register').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();

      // Register session
      const newUser = {
        id: 'user-' + Math.random().toString(36).substring(2, 11),
        full_name: name,
        email: email,
        is_admin: false
      };

      api.setToken('demo-token-customer');
      api.setCurrentUser(newUser);

      showToast('Registration successful! Welcome to SmartCart.');
      setTimeout(() => window.location.href = '/index.html', 800);
    });
  </script>
</body>
</html>
