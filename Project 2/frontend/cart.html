<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - SmartCart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sc-navbar sticky-top">
    <div class="container">
      <a class="sc-brand" href="/index.html">
        <i class="bi bi-cart3"></i>
        <span>SmartCart</span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link sc-nav-link" href="/shop.html">Shop All</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="/wishlist.html" class="text-secondary text-decoration-none"><i class="bi bi-heart fs-5"></i></a>
          <a href="/cart.html" class="text-secondary text-decoration-none active"><i class="bi bi-bag fs-5 text-primary"></i></a>
          <div id="nav-auth-section" class="d-flex align-items-center gap-2"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Cart Section -->
  <main class="py-5">
    <div class="container">
      <h1 class="h3 fw-bold mb-4">Your Shopping Cart</h1>

      <div id="cart-content-wrapper">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="sc-footer">
    <div class="container text-center small">
      &copy; 2026 SmartCart Inc. Handcrafted checkout experience.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    async function loadCart() {
      const wrapper = document.getElementById('cart-content-wrapper');

      if (!api.getToken()) {
        wrapper.innerHTML = `
          <div class="text-center py-5 bg-white border rounded-3 p-5">
            <i class="bi bi-lock fs-1 text-muted mb-3 d-block"></i>
            <h4 class="fw-bold">Sign In Required</h4>
            <p class="text-muted small">Please log in to your account to access your saved shopping cart.</p>
            <a href="/login.html?redirect=/cart.html" class="btn btn-primary px-4 mt-2">Sign In to Continue</a>
          </div>
        `;
        return;
      }

      try {
        const cart = await api.getCart();

        if (!cart.items || cart.items.length === 0) {
          wrapper.innerHTML = `
            <div class="text-center py-5 bg-white border rounded-3 p-5">
              <i class="bi bi-bag-x fs-1 text-muted mb-3 d-block"></i>
              <h4 class="fw-bold">Your Cart is Empty</h4>
              <p class="text-muted small">Explore our curated collections and add your favorite items to cart.</p>
              <a href="/shop.html" class="btn btn-primary px-4 mt-2">Start Shopping</a>
            </div>
          `;
          updateNavState();
          return;
        }

        wrapper.innerHTML = `
          <div class="row g-4">
            <!-- Items Table -->
            <div class="col-lg-8">
              <div class="bg-white border rounded-3 p-4">
                <div class="table-responsive">
                  <table class="table align-middle mb-0">
                    <thead class="table-light small text-uppercase text-muted">
                      <tr>
                        <th scope="col" style="min-width: 260px;">Product</th>
                        <th scope="col">Price</th>
                        <th scope="col" style="min-width: 140px;">Quantity</th>
                        <th scope="col">Subtotal</th>
                        <th scope="col"></th>
                      </tr>
                    </thead>
                    <tbody>
                      ${cart.items.map(item => `
                        <tr>
                          <td>
                            <div class="d-flex align-items-center gap-3">
                              <img src="${item.image_url}" alt="${item.product_name}" class="rounded border" style="width: 60px; height: 60px; object-fit: cover;">
                              <div>
                                <a href="/product.html?id=${item.product_id}" class="fw-semibold text-dark text-decoration-none small d-block">
                                  ${item.product_name}
                                </a>
                                <span class="text-muted small">${item.stock_quantity > 0 ? 'In Stock' : 'Out of stock'}</span>
                              </div>
                            </div>
                          </td>
                          <td class="fw-medium">${formatINR(item.price)}</td>
                          <td>
                            <div class="input-group input-group-sm" style="width: 110px;">
                              <button class="btn btn-outline-secondary" onclick="changeQuantity('${item.id}', ${item.quantity - 1})">-</button>
                              <input type="text" class="form-control text-center" value="${item.quantity}" readonly>
                              <button class="btn btn-outline-secondary" onclick="changeQuantity('${item.id}', ${item.quantity + 1})" ${item.quantity >= item.stock_quantity ? 'disabled' : ''}>+</button>
                            </div>
                          </td>
                          <td class="fw-bold text-dark">${formatINR(item.line_total)}</td>
                          <td class="text-end">
                            <button class="btn btn-sm text-danger" onclick="deleteItem('${item.id}')" title="Remove">
                              <i class="bi bi-trash"></i>
                            </button>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Order Summary Card -->
            <div class="col-lg-4">
              <div class="bg-white border rounded-3 p-4 sticky-top" style="top: 85px;">
                <h5 class="fw-bold mb-3">Order Summary</h5>

                <div class="d-flex justify-content-between mb-2 small text-muted">
                  <span>Subtotal</span>
                  <span class="text-dark fw-semibold">${formatINR(cart.subtotal)}</span>
                </div>

                <div class="d-flex justify-content-between mb-3 small text-muted">
                  <span>Estimated Shipping</span>
                  <span class="text-dark fw-semibold">
                    ${cart.free_shipping_achieved ? '<span class="text-success fw-bold">FREE</span>' : formatINR(cart.shipping_fee)}
                  </span>
                </div>

                ${!cart.free_shipping_achieved ? `
                  <div class="alert alert-info py-2 small mb-3">
                    Add ${formatINR(cart.free_shipping_threshold - cart.subtotal)} more to qualify for <strong>FREE Delivery</strong>!
                  </div>
                ` : `
                  <div class="alert alert-success py-2 small mb-3">
                    <i class="bi bi-check-circle-fill me-1"></i> You unlocked Free Express Delivery!
                  </div>
                `}

                <hr>

                <div class="d-flex justify-content-between mb-4">
                  <span class="fw-bold text-dark">Total Amount</span>
                  <span class="fs-4 fw-bold text-primary">${formatINR(cart.total)}</span>
                </div>

                <a href="/checkout.html" class="btn btn-primary w-100 py-2 fw-semibold">
                  Proceed to Checkout <i class="bi bi-arrow-right ms-1"></i>
                </a>

                <div class="mt-3 text-center">
                  <a href="/shop.html" class="text-muted small text-decoration-none">
                    &larr; Continue Shopping
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
        updateNavState();
      } catch (err) {
        wrapper.innerHTML = `<div class="alert alert-danger">Error loading cart: ${err.message}</div>`;
      }
    }

    async function changeQuantity(itemId, newQty) {
      if (newQty < 1) {
        deleteItem(itemId);
        return;
      }
      try {
        await api.updateCartItem(itemId, newQty);
        loadCart();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteItem(itemId) {
      try {
        await api.removeFromCart(itemId);
        showToast('Item removed from cart');
        loadCart();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadCart);
  </script>
</body>
</html>
