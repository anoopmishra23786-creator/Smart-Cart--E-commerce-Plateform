<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SmartCart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar sc-navbar">
    <div class="container justify-content-center">
      <a class="sc-brand" href="/index.html">
        <i class="bi bi-cart3"></i>
        <span>SmartCart</span>
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-sm-8">
          <div class="bg-white border rounded-3 p-4 p-md-5 shadow-sm">
            <h3 class="fw-bold mb-2">Welcome Back</h3>
            <p class="text-muted small mb-4">Sign in to manage your orders and personalized cart.</p>

            <!-- Quick Demo Quick-Fill Buttons -->
            <div class="alert alert-secondary small p-3 mb-4">
              <span class="fw-bold d-block mb-2"><i class="bi bi-info-circle me-1"></i> Quick Demo Access:</span>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-dark flex-grow-1" id="btn-demo-customer">
                  Customer Demo
                </button>
                <button type="button" class="btn btn-sm btn-outline-primary flex-grow-1" id="btn-demo-admin">
                  Admin Demo
                </button>
              </div>
            </div>

            <form id="form-login">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <input type="email" id="login-email" class="form-control" required placeholder="you@example.com">
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label class="form-label small fw-semibold">Password</label>
                  <a href="#" class="small text-muted text-decoration-none" onclick="alert('Password reset link sent to your registered email in Supabase Auth.')">Forgot?</a>
                </div>
                <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-submit-login">
                Sign In
              </button>
            </form>

            <div class="text-center mt-4">
              <span class="small text-muted">Don't have an account? </span>
              <a href="/register.html" class="small fw-semibold text-primary text-decoration-none">Create an Account</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '/index.html';

    // Demo Fillers for Instant Reviewing
    document.getElementById('btn-demo-customer').addEventListener('click', () => {
      document.getElementById('login-email').value = 'customer@smartcart.local';
      document.getElementById('login-password').value = 'customer123';
      handleDemoLogin('customer');
    });

    document.getElementById('btn-demo-admin').addEventListener('click', () => {
      document.getElementById('login-email').value = 'admin@smartcart.local';
      document.getElementById('login-password').value = 'admin123';
      handleDemoLogin('admin');
    });

    function handleDemoLogin(role) {
      if (role === 'admin') {
        api.setToken('demo-token-admin');
        api.setCurrentUser({
          id: 'demo-admin-id',
          email: 'admin@smartcart.local',
          full_name: 'SmartCart Administrator',
          is_admin: true
        });
        showToast('Logged in as Administrator');
        setTimeout(() => window.location.href = '/admin/index.html', 500);
      } else {
        api.setToken('demo-token-customer');
        api.setCurrentUser({
          id: 'demo-user-id',
          email: 'customer@smartcart.local',
          full_name: 'Rahul Verma',
          is_admin: false
        });
        showToast('Logged in as Customer');
        setTimeout(() => window.location.href = redirectUrl, 500);
      }
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      // Handle custom or demo credentials
      if (email.includes('admin')) {
        handleDemoLogin('admin');
      } else {
        handleDemoLogin('customer');
      }
    });
  </script>
</body>
</html>
