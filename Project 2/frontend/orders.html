<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - SmartCart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sc-navbar sticky-top">
    <div class="container">
      <a class="sc-brand" href="/index.html">
        <i class="bi bi-cart3"></i>
        <span>SmartCart</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="/shop.html" class="nav-link sc-nav-link">Shop</a>
        <a href="/cart.html" class="text-secondary text-decoration-none"><i class="bi bi-bag fs-5"></i></a>
        <div id="nav-auth-section" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 fw-bold mb-1">Order History & Tracking</h1>
          <p class="text-muted small mb-0">Review status, invoice snapshots, and delivered packages.</p>
        </div>
        <a href="/shop.html" class="btn btn-outline-primary btn-sm">Explore More Products</a>
      </div>

      <div id="orders-container">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="sc-footer">
    <div class="container text-center small">
      &copy; 2026 SmartCart Inc. Handcrafted order fulfillment.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    async function loadOrders() {
      if (!api.getToken()) {
        window.location.href = '/login.html?redirect=/orders.html';
        return;
      }

      const container = document.getElementById('orders-container');

      try {
        const orders = await api.getOrders();

        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div class="text-center py-5 bg-white border rounded-3 p-5">
              <i class="bi bi-box-seam fs-1 text-muted mb-3 d-block"></i>
              <h4 class="fw-bold">No Orders Placed Yet</h4>
              <p class="text-muted small">You haven't completed any orders yet. Discover items in our store!</p>
              <a href="/shop.html" class="btn btn-primary px-4 mt-2">Browse Catalog</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => {
          const statusBadge = {
            'pending': 'bg-warning-subtle text-warning border border-warning-subtle',
            'processing': 'bg-info-subtle text-info border border-info-subtle',
            'shipped': 'bg-primary-subtle text-primary border border-primary-subtle',
            'delivered': 'bg-success-subtle text-success border border-success-subtle',
            'cancelled': 'bg-danger-subtle text-danger border border-danger-subtle'
          }[o.order_status] || 'bg-light text-dark';

          const formattedDate = o.created_at ? new Date(o.created_at).toLocaleDateString('en-IN', {
            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
          }) : 'Recently Placed';

          return `
            <div class="bg-white border rounded-3 p-4 mb-4 shadow-sm">
              <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-3 mb-3 gap-2">
                <div>
                  <span class="text-muted small">Order ID: </span>
                  <span class="fw-bold text-dark font-monospace">${o.id}</span>
                  <span class="text-muted small ms-3"><i class="bi bi-calendar3 me-1"></i>${formattedDate}</span>
                </div>
                <div>
                  <span class="badge ${statusBadge} px-3 py-2 text-uppercase fw-bold">${o.order_status}</span>
                </div>
              </div>

              <!-- Item List -->
              <div class="row g-3 mb-3">
                <div class="col-md-8">
                  <div class="d-flex flex-column gap-2">
                    ${o.items.map(it => `
                      <div class="d-flex justify-content-between align-items-center small py-1 border-bottom">
                        <div>
                          <span class="fw-semibold text-dark">${it.product_name}</span>
                          <span class="text-muted ms-2">× ${it.quantity}</span>
                        </div>
                        <span class="fw-bold text-dark">${formatINR(it.line_total)}</span>
                      </div>
                    `).join('')}
                  </div>

                  <div class="mt-3 p-2 bg-light rounded small text-muted">
                    <i class="bi bi-geo-alt me-1 text-primary"></i> <strong>Shipping To:</strong> ${o.recipient_name} (${o.phone}) — ${o.shipping_address}
                  </div>
                </div>

                <div class="col-md-4 border-start-md ps-md-4 d-flex flex-column justify-content-center">
                  <div class="small text-muted mb-1">Payment Method: <strong class="text-dark text-uppercase">${o.payment_method.replace('_', ' ')}</strong></div>
                  <div class="small text-muted mb-2">Payment Status: <strong class="text-uppercase text-${o.payment_status === 'paid' ? 'success' : 'warning'}">${o.payment_status}</strong></div>
                  <div class="d-flex justify-content-between align-items-baseline mt-2">
                    <span class="fw-semibold text-dark">Order Total:</span>
                    <span class="fs-4 fw-bold text-primary">${formatINR(o.total_amount)}</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Error retrieving orders: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
